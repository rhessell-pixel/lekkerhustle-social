# Makes tomorrow's three posts every afternoon, on GitHub itself, so the 18:00 email never depends on another scheduler.
# Needs the repo secret ANTHROPIC_API_KEY. Runs at 15:10 SA time and again at 16:10 as a safety net; does nothing if tomorrow's folder
# already exists (e.g. made by hand). "Run workflow" makes a day by hand (leave the day empty for tomorrow).
name: Make tomorrow's posts
on:
  schedule:
    - cron: "10 13 * * *"
    - cron: "10 14 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Day (YYYY-MM-DD), empty = tomorrow"
        required: false
permissions:
  contents: write
concurrency:
  group: build-posts
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Write the words
        id: words
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "ANTHROPIC_API_KEY secret is not set"; exit 1; }
          out=$(python3 tools/make_content.py ${{ github.event.inputs.day }})
          echo "result=$out" >> "$GITHUB_OUTPUT"; echo "$out"
      - name: Install ffmpeg and Playwright
        if: steps.words.outputs.result != 'exists'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install playwright >/dev/null && playwright install --with-deps chromium >/dev/null
      - name: Build with photos
        if: steps.words.outputs.result != 'exists'
        run: |
          mkdir -p logs; : > logs/last-build.log
          f="queue/${{ steps.words.outputs.result }}/content.json"
          echo "== $f" >> logs/last-build.log
          python3 tools/build.py "$f" >> logs/last-build.log 2>&1 || { echo "BUILD FAILED $f" >> logs/last-build.log; cat logs/last-build.log; exit 1; }
      - name: Commit
        if: steps.words.outputs.result != 'exists'
        run: |
          git config user.name "lekker-hustle-posts-bot"
          git config user.email "posts-bot@users.noreply.github.com"
          git add queue logs tools/used-photos.json 2>/dev/null || git add queue logs
          git commit -m "Posts for ${{ steps.words.outputs.result }} (daily workflow)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
